name: databridge-dev

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?missing_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: databridge_source
      MYSQL_USER: databridge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?missing_MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --server-id=5401
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init/01-cdc-grants.sql:/docker-entrypoint-initdb.d/01-cdc-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: databridge_target
      POSTGRES_USER: databridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing_POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
